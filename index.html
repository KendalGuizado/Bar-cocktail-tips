<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Ledger — Tip Tracker</title>
<meta name="theme-color" content="#15110D" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #15110D; --surface: #1F1912; --surface2: #2A2118; --line: #3A2E20;
    --brass: #C08A3F; --brassLight: #D9A85C; --green: #4C6350; --greenLight: #7FA687;
    --text: #F3ECE2; --textMuted: #A0917D; --danger: #C06A5E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  input, select, button { font-family: inherit; }
  input:focus, select:focus { outline: 2px solid var(--brass); outline-offset: -1px; }
  button { cursor: pointer; }
  ::placeholder { color: var(--textMuted); opacity: 0.7; }
  .receipt-edge { background-image: repeating-linear-gradient(-45deg, var(--bg) 0, var(--bg) 6px, transparent 6px, transparent 12px); height: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const TIME_PRESETS = ["11:00 AM", "2:00 PM", "5:00 PM", "8:00 PM", "11:00 PM"];
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const SHIFTS_KEY = "ledger_shifts";
const ROSTER_KEY = "ledger_servers";
const SYNC_CODE_KEY = "ledger_sync_code";

// ---- Cloud sync setup ----
// Paste your Firebase config below (from Firebase console → Project settings → your web app).
// Until you do, the app keeps working fine using local-only storage.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID",
};

let db = null;
try {
  if (typeof firebase !== "undefined" && firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
} catch (e) {
  db = null;
}
const DB_AVAILABLE = !!db;

function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function fullName(r) { return `${r.first} ${r.last}`.trim(); }
function roundLabel(startIdx) {
  const start = TIME_PRESETS[startIdx];
  const end = startIdx < TIME_PRESETS.length - 1 ? TIME_PRESETS[startIdx + 1] : "2:00 AM";
  return `${start} – ${end}`;
}
function emptyRound(startIdx) {
  return { id: uid(), startIdx, servers: [{ id: uid(), name: "", tip: "", carryForward: false, groupId: null }] };
}
function emptyBarServer() {
  return { id: uid(), name: "", cash: "", credit: "" };
}
function emptyDraft(type) {
  const base = { date: new Date().toISOString().slice(0, 10), tipOutPercent: "18", adjustmentLabel: "", adjustmentAmount: "", type: type || "rotation" };
  if (base.type === "bar") return { ...base, servers: [emptyBarServer()] };
  return { ...base, rounds: [emptyRound(0)] };
}
function money(n) {
  const v = Number.isFinite(n) ? n : 0;
  return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function roundTotal(round) { return round.servers.reduce((s, sv) => s + (parseFloat(sv.tip) || 0), 0); }
function barServerTotal(sv) { return (parseFloat(sv.cash) || 0) + (parseFloat(sv.credit) || 0); }
function computeShift(shift) {
  const pct = parseFloat(shift.tipOutPercent) || 0;
  const adj = parseFloat(shift.adjustmentAmount) || 0;
  if (shift.type === "bar") {
    const cashTotal = shift.servers.reduce((s, sv) => s + (parseFloat(sv.cash) || 0), 0);
    const creditTotal = shift.servers.reduce((s, sv) => s + (parseFloat(sv.credit) || 0), 0);
    const total = cashTotal + creditTotal;
    const barbackCut = Math.round(total * (pct / 100));
    return { total, barbackCut, takeHome: total - barbackCut + adj, adj, cashTotal, creditTotal };
  }
  const total = shift.rounds.reduce((sum, r) => sum + roundTotal(r), 0);
  const barbackCut = Math.round(total * (pct / 100));
  return { total, barbackCut, takeHome: total - barbackCut + adj, adj, cashTotal: 0, creditTotal: 0 };
}
function computeGroupTotals(obj) {
  if (!obj.rounds) return {};
  const groups = {};
  obj.rounds.forEach((r) => r.servers.forEach((sv) => {
    if (!sv.groupId) return;
    if (!groups[sv.groupId]) groups[sv.groupId] = { total: 0, count: 0 };
    groups[sv.groupId].total += parseFloat(sv.tip) || 0;
    groups[sv.groupId].count += 1;
  }));
  return groups;
}
function effectiveTip(sv, groups) {
  if (sv.groupId && groups[sv.groupId] && groups[sv.groupId].count > 0) return groups[sv.groupId].total / groups[sv.groupId].count;
  return parseFloat(sv.tip) || 0;
}
function effectiveRoundTotal(round, groups) { return round.servers.reduce((sum, sv) => sum + effectiveTip(sv, groups), 0); }
function dateKeyOf(y, m, d) { return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function buildMonthCells(year, month) {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}

function Card({ children, style }) {
  return <div style={{ background: "var(--surface)", border: "1px solid var(--line)", borderRadius: 16, padding: 16, marginBottom: 16, ...style }}>{children}</div>;
}
function Label({ children }) {
  return <label style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--textMuted)", display: "block", marginBottom: 6 }}>{children}</label>;
}
function inputStyle() { return { background: "var(--surface2)", border: "1px solid var(--line)", color: "var(--text)", borderRadius: 8, padding: "8px 12px", fontSize: 14, width: "100%" }; }
function Row({ label, value, muted, whole }) {
  const negative = value < 0;
  const display = whole ? Math.round(Math.abs(value)).toLocaleString("en-US") : money(Math.abs(value));
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "2px 0" }}>
      <span style={{ color: muted ? "var(--textMuted)" : "var(--text)" }}>{label}</span>
      <span className="font-mono" style={{ color: muted ? "var(--textMuted)" : "var(--text)" }}>{negative ? "-" : ""}${display}</span>
    </div>
  );
}
function StatBox({ label, value }) {
  return (
    <div style={{ background: "var(--surface2)", borderRadius: 12, padding: 12, flex: 1 }}>
      <p style={{ fontSize: 11, color: "var(--textMuted)", margin: "0 0 4px" }}>{label}</p>
      <p className="font-mono" style={{ fontSize: 18, fontWeight: 600, color: "var(--brassLight)", margin: 0 }}>{value}</p>
    </div>
  );
}
function LineChartSVG({ data, height = 160, color }) {
  if (!data.length) return null;
  const width = 300;
  const values = data.map((d) => d.y);
  const max = Math.max(...values, 0), min = Math.min(...values, 0);
  const range = max - min || 1;
  const stepX = data.length > 1 ? width / (data.length - 1) : width;
  const pts = data.map((d, i) => [i * stepX, height - ((d.y - min) / range) * (height - 20) - 10]);
  const points = pts.map((p) => p.join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height }} preserveAspectRatio="none">
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" vectorEffect="non-scaling-stroke" />
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color} />)}
    </svg>
  );
}
function BarChartRow({ data, color }) {
  const max = Math.max(...data.map((d) => d.y), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {data.map((d, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ width: 60, fontSize: 12, flexShrink: 0 }}>{d.x}</span>
          <div style={{ flex: 1, background: "var(--surface2)", borderRadius: 4, height: 14, overflow: "hidden" }}>
            <div style={{ width: `${(d.y / max) * 100}%`, background: color, height: "100%" }} />
          </div>
          <span className="font-mono" style={{ width: 55, textAlign: "right", fontSize: 11, color: "var(--textMuted)", flexShrink: 0 }}>${money(d.y)}</span>
        </div>
      ))}
    </div>
  );
}
function ChartCard({ title, children }) {
  return (
    <Card>
      <p style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--textMuted)", margin: "0 0 12px" }}>{title}</p>
      {children}
    </Card>
  );
}

function NameAutocomplete({ value, onChange, roster }) {
  const [open, setOpen] = useState(false);
  const query = value.trim().toLowerCase();
  const matches = query.length > 0 ? roster.filter((r) => {
    const full = fullName(r).toLowerCase();
    return full.startsWith(query) || r.first.toLowerCase().startsWith(query);
  }).slice(0, 5) : [];
  return (
    <div style={{ position: "relative", flex: 1, minWidth: 0 }}>
      <input placeholder="Server name" value={value}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 120)}
        style={inputStyle()} />
      {open && matches.length > 0 && (
        <div style={{ position: "absolute", zIndex: 10, left: 0, right: 0, marginTop: 4, borderRadius: 8, overflow: "hidden", background: "var(--surface2)", border: "1px solid var(--line)" }}>
          {matches.map((m) => (
            <button key={m.id} onMouseDown={(e) => { e.preventDefault(); onChange(fullName(m)); setOpen(false); }}
              style={{ display: "block", width: "100%", textAlign: "left", padding: "8px 12px", fontSize: 14, background: "none", border: "none", color: "var(--text)" }}>
              {fullName(m)}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ReceiptSummary({ totals }) {
  const isBar = totals.cashTotal > 0 || totals.creditTotal > 0;
  return (
    <div style={{ marginBottom: 16, borderRadius: "16px 16px 0 0", overflow: "hidden" }}>
      <div style={{ padding: "16px 20px", background: "var(--surface2)" }}>
        <p style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--textMuted)", textAlign: "center", margin: "0 0 12px" }}>Shift Summary</p>
        {isBar && <Row label="Cash tips" value={totals.cashTotal} muted />}
        {isBar && <Row label="Credit tips" value={totals.creditTotal} muted />}
        <Row label="Total tips" value={totals.total} />
        <Row label="Barback tip-out" value={-totals.barbackCut} muted whole />
        {totals.adj !== 0 && <Row label="Adjustment" value={totals.adj} muted />}
        <div style={{ margin: "8px 0", borderTop: "1px dashed var(--line)" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <span style={{ fontSize: 14, fontWeight: 500 }}>Your take-home</span>
          <span className="font-mono" style={{ fontSize: 20, fontWeight: 600, color: "var(--greenLight)" }}>${money(totals.takeHome)}</span>
        </div>
      </div>
      <div className="receipt-edge" />
    </div>
  );
}

function NewShiftForm(props) {
  const { draft, setDraft, totals, roster, updateServer, addServer, removeServer, addRound, removeRound, setRoundStartIdx, toggleCarryForward,
    updateBarServer, addBarServer, removeBarServer, onSave, saveError, editingId, onCancelEdit } = props;
  const groups = useMemo(() => computeGroupTotals(draft), [draft]);
  const isBar = draft.type === "bar";
  return (
    <div>
      {editingId ? (
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16, padding: "8px 12px", borderRadius: 8, fontSize: 12, background: "var(--surface2)", color: "var(--brassLight)" }}>
          <span>Editing {isBar ? "bar" : "rotation"} shift from {draft.date}</span>
          <button onClick={onCancelEdit} style={{ background: "none", border: "none", color: "var(--brassLight)", textDecoration: "underline" }}>Cancel</button>
        </div>
      ) : (
        <div style={{ display: "flex", gap: 4, marginBottom: 16, padding: 4, borderRadius: 12, background: "var(--surface)" }}>
          {[{ id: "rotation", label: "Cocktail Rotation" }, { id: "bar", label: "Bar Shift" }].map((opt) => (
            <button key={opt.id} onClick={() => setDraft(emptyDraft(opt.id))}
              style={{ flex: 1, padding: "8px 0", borderRadius: 8, fontSize: 12, fontWeight: 500, border: "none",
                background: draft.type === opt.id ? "var(--brass)" : "transparent", color: draft.type === opt.id ? "var(--bg)" : "var(--textMuted)" }}>
              {opt.label}
            </button>
          ))}
        </div>
      )}
      <Card>
        <Label>Date</Label>
        <input type="date" value={draft.date} onChange={(e) => setDraft((d) => ({ ...d, date: e.target.value }))} className="font-mono" style={inputStyle()} />
      </Card>

      {isBar ? (
        <Card>
          <Label>Servers</Label>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {draft.servers.map((sv) => (
              <div key={sv.id} style={{ display: "flex", flexDirection: "column", gap: 6, paddingBottom: 8, borderBottom: "1px solid var(--line)" }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <NameAutocomplete value={sv.name} onChange={(v) => updateBarServer(sv.id, "name", v)} roster={roster} />
                  <button onClick={() => removeBarServer(sv.id)} style={{ background: "none", border: "none", color: "var(--textMuted)", flexShrink: 0, fontSize: 15 }}>🗑</button>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <div style={{ position: "relative", flex: 1 }}>
                    <span className="font-mono" style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", fontSize: 14, color: "var(--textMuted)" }}>$</span>
                    <input type="number" inputMode="decimal" placeholder="Cash" value={sv.cash} onChange={(e) => updateBarServer(sv.id, "cash", e.target.value)} className="font-mono" style={{ ...inputStyle(), paddingLeft: 20 }} />
                  </div>
                  <div style={{ position: "relative", flex: 1 }}>
                    <span className="font-mono" style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", fontSize: 14, color: "var(--textMuted)" }}>$</span>
                    <input type="number" inputMode="decimal" placeholder="Credit" value={sv.credit} onChange={(e) => updateBarServer(sv.id, "credit", e.target.value)} className="font-mono" style={{ ...inputStyle(), paddingLeft: 20 }} />
                  </div>
                </div>
              </div>
            ))}
          </div>
          <button onClick={addBarServer} style={{ background: "none", border: "none", display: "flex", alignItems: "center", gap: 4, fontSize: 12, fontWeight: 500, color: "var(--brass)", marginTop: 10 }}>+ Add server</button>
        </Card>
      ) : (
        draft.rounds.map((round, ri) => (
          <Card key={round.id}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, gap: 8 }}>
              <span className="font-mono" style={{ fontSize: 11, padding: "2px 8px", borderRadius: 4, background: "var(--surface2)", color: "var(--textMuted)", flexShrink: 0 }}>R{ri + 1}</span>
              <select value={round.startIdx} onChange={(e) => setRoundStartIdx(round.id, parseInt(e.target.value, 10))} className="font-mono" style={{ ...inputStyle(), width: "auto", flexShrink: 0 }}>
                {TIME_PRESETS.map((t, i) => <option key={t} value={i}>{t}</option>)}
              </select>
              <span className="font-display" style={{ fontSize: 14, flex: 1, textAlign: "right", color: "var(--brassLight)" }}>
                → {round.startIdx < TIME_PRESETS.length - 1 ? TIME_PRESETS[round.startIdx + 1] : "2:00 AM"}
              </span>
              {draft.rounds.length > 1 && <button onClick={() => removeRound(round.id)} style={{ background: "none", border: "none", color: "var(--textMuted)", flexShrink: 0, fontSize: 16 }}>✕</button>}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {round.servers.map((sv) => {
                const hasNextRound = ri < draft.rounds.length - 1;
                return (
                  <div key={sv.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <NameAutocomplete value={sv.name} onChange={(v) => updateServer(round.id, sv.id, "name", v)} roster={roster} />
                    {hasNextRound && (
                      <button onClick={() => toggleCarryForward(round.id, sv.id)}
                        title="They'll also work the next round and tip once at the end — splits evenly"
                        style={{ flexShrink: 0, width: 34, height: 34, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15,
                          background: sv.carryForward ? "var(--brass)" : "var(--surface2)",
                          border: `1px solid ${sv.carryForward ? "var(--brass)" : "var(--line)"}`,
                          color: sv.carryForward ? "var(--bg)" : "var(--textMuted)" }}>🔗</button>
                    )}
                    <div style={{ position: "relative", width: 96, flexShrink: 0 }}>
                      <span className="font-mono" style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", fontSize: 14, color: "var(--textMuted)" }}>$</span>
                      <input type="number" inputMode="decimal" placeholder={sv.carryForward ? "next rd" : "0.00"} disabled={sv.carryForward}
                        value={sv.tip} onChange={(e) => updateServer(round.id, sv.id, "tip", e.target.value)}
                        className="font-mono" style={{ ...inputStyle(), paddingLeft: 20, opacity: sv.carryForward ? 0.5 : 1 }} />
                    </div>
                    <button onClick={() => removeServer(round.id, sv.id)} style={{ background: "none", border: "none", color: "var(--textMuted)", flexShrink: 0, fontSize: 15 }}>🗑</button>
                  </div>
                );
              })}
            </div>
            {round.servers.some((sv) => sv.groupId && groups[sv.groupId] && groups[sv.groupId].count > 1 && !sv.carryForward) && (
              <p style={{ fontSize: 12, marginTop: 8, color: "var(--textMuted)" }}>Linked tips split evenly across the rounds they cover.</p>
            )}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12 }}>
              <button onClick={() => addServer(round.id)} style={{ background: "none", border: "none", display: "flex", alignItems: "center", gap: 4, fontSize: 12, fontWeight: 500, color: "var(--brass)" }}>+ Add server</button>
              <span className="font-mono" style={{ fontSize: 12, color: "var(--textMuted)" }}>${money(effectiveRoundTotal(round, groups))}</span>
            </div>
          </Card>
        ))
      )}

      {!isBar && draft.rounds.length < 4 && (
        <button onClick={addRound} style={{ width: "100%", marginBottom: 16, padding: "10px 0", borderRadius: 12, fontSize: 14, fontWeight: 500, border: "1px dashed var(--line)", background: "none", color: "var(--textMuted)" }}>+ Add round</button>
      )}

      <Card>
        <Label>Barback tip-out % {isBar && "(of cash + credit combined)"}</Label>
        <input type="number" inputMode="decimal" value={draft.tipOutPercent} onChange={(e) => setDraft((d) => ({ ...d, tipOutPercent: e.target.value }))} className="font-mono" style={{ ...inputStyle(), marginBottom: 16 }} />
        <Label>Adjustment (optional)</Label>
        <div style={{ display: "flex", gap: 8 }}>
          <input placeholder="Label, e.g. extra barback tip" value={draft.adjustmentLabel} onChange={(e) => setDraft((d) => ({ ...d, adjustmentLabel: e.target.value }))} style={{ ...inputStyle(), flex: 1 }} />
          <div style={{ position: "relative", width: 96, flexShrink: 0 }}>
            <span className="font-mono" style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", fontSize: 14, color: "var(--textMuted)" }}>$</span>
            <input type="number" inputMode="decimal" placeholder="0.00" value={draft.adjustmentAmount} onChange={(e) => setDraft((d) => ({ ...d, adjustmentAmount: e.target.value }))} className="font-mono" style={{ ...inputStyle(), paddingLeft: 20 }} />
          </div>
        </div>
      </Card>

      <ReceiptSummary totals={totals} />
      {saveError && <p style={{ fontSize: 12, marginBottom: 8, textAlign: "center", color: "var(--danger)" }}>{saveError}</p>}
      <button onClick={onSave} disabled={totals.total <= 0} style={{ width: "100%", padding: "12px 0", borderRadius: 12, fontWeight: 600, fontSize: 14, border: "none", background: "var(--brass)", color: "var(--bg)", opacity: totals.total <= 0 ? 0.4 : 1 }}>
        {editingId ? "Update shift" : "Save shift"}
      </button>
    </div>
  );
}

function ShiftDetail({ shift, onDelete, onEdit }) {
  const t = computeShift(shift);
  const isBar = shift.type === "bar";
  const groups = computeGroupTotals(shift);
  return (
    <div style={{ marginTop: 16, paddingTop: 16, borderTop: "1px solid var(--line)" }}>
      {isBar ? (
        <div style={{ marginBottom: 12 }}>
          <div style={{ display: "flex", fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--textMuted)", margin: "0 0 4px" }}>
            <span style={{ flex: 1 }}>Server</span><span style={{ width: 60, textAlign: "right" }}>Cash</span><span style={{ width: 60, textAlign: "right" }}>Credit</span>
          </div>
          {shift.servers.map((sv) => (
            <div key={sv.id} style={{ display: "flex", fontSize: 14, padding: "2px 0" }}>
              <span style={{ flex: 1 }}>{sv.name || "—"}</span>
              <span className="font-mono" style={{ width: 60, textAlign: "right" }}>${money(parseFloat(sv.cash) || 0)}</span>

function CalendarView({ shiftsByDate, calMonth, setCalMonth, calSelected, setCalSelected, onDelete, onEdit }) {

  const monthLabel = new Date(calMonth.y, calMonth.m, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  function shiftMonth(delta) {
    let m = calMonth.m + delta, y = calMonth.y;
    if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
    setCalMonth({ y, m }); setCalSelected(null);
  }
  const selectedShifts = calSelected ? shiftsByDate[calSelected] || [] : [];
  return (
    <div>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>

          <button onClick={() => shiftMonth(1)} style={{ background: "none", border: "none", color: "var(--textMuted)", fontSize: 18 }}>›</button>

            const dayShifts = shiftsByDate[key];
            const hasShift = dayShifts && dayShifts.length > 0;

            const isSelected = calSelected === key;

function ServerDetail({ rosterEntry, name, shifts, onBack, onDelete }) {
  const currentYear = new Date().getFullYear();
  const data = useMemo(() => {
    let lifetime = 0, yearTotal = 0, appearances = 0;
    const shiftDates = new Set(); const history = [];
    shifts.forEach((s) => {
      const y = new Date(s.date + "T00:00:00").getFullYear();
      if (s.type === "bar") {
        s.servers.forEach((sv) => {
          if (sv.name.trim() !== name) return;
          const tip = barServerTotal(sv);
          lifetime += tip;
          if (y === currentYear) yearTotal += tip;
          appearances += 1; shiftDates.add(s.date);
          history.push({ date: s.date, round: "Bar shift", tip });
        });
        return;
      }
      const groups = computeGroupTotals(s);
      s.rounds.forEach((r) => r.servers.forEach((sv) => {
        if (sv.name.trim() !== name) return;
        const tip = effectiveTip(sv, groups);
        lifetime += tip;
        if (y === currentYear) yearTotal += tip;
        appearances += 1; shiftDates.add(s.date);
        history.push({ date: s.date, round: roundLabel(r.startIdx ?? 0), tip });
      }));
    });
    history.sort((a, b) => (a.date < b.date ? 1 : -1));
    return { lifetime, yearTotal, appearances, shiftCount: shiftDates.size, avg: appearances ? lifetime / appearances : 0, history: history.slice(0, 12) };
  }, [shifts, name, currentYear]);
  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "none", display: "flex", alignItems: "center", gap: 6, fontSize: 14, marginBottom: 16, color: "var(--textMuted)" }}>← All servers</button>
      <Card>
        <p className="font-display" style={{ fontSize: 20, margin: "0 0 4px", color: "var(--brassLight)" }}>{name}</p>
        <p style={{ fontSize: 11, margin: "0 0 16px", color: "var(--textMuted)" }}>{data.shiftCount} shift{data.shiftCount !== 1 ? "s" : ""} · {data.appearances} round{data.appearances !== 1 ? "s" : ""} worked</p>
        <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
          <StatBox label="Lifetime tips" value={`$${money(data.lifetime)}`} />
          <StatBox label={`${currentYear} tips`} value={`$${money(data.yearTotal)}`} />
        </div>
        <div style={{ display: "flex", gap: 12 }}>
          <StatBox label="Avg per round" value={`$${money(data.avg)}`} />
          <StatBox label="Shifts worked" value={data.shiftCount} />
        </div>
      </Card>
      {data.history.length > 0 && (
        <Card>
          <p style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 12px", color: "var(--textMuted)" }}>Recent tips</p>
          {data.history.map((h, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "4px 0", borderTop: i > 0 ? "1px solid var(--line)" : "none" }}>
              <span style={{ color: "var(--textMuted)" }}>{new Date(h.date + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" })} · {h.round}</span>
              <span className="font-mono">${money(h.tip)}</span>
            </div>
          ))}
        </Card>
      )}
      {rosterEntry && <button onClick={() => onDelete(rosterEntry.id)} style={{ background: "none", border: "none", display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--danger)" }}>🗑 Remove from roster</button>}
    </div>
  );
}

function TipLedger() {
  const [tab, setTab] = useState("new");
  const [shifts, setShifts] = useState([]);
  const [roster, setRoster] = useState([]);
  const [saveError, setSaveError] = useState("");
  const [draft, setDraft] = useState(emptyDraft("rotation"));
  const [editingId, setEditingId] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [historyView, setHistoryView] = useState("list");
  const [calMonth, setCalMonth] = useState(() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() }; });
  const [calSelected, setCalSelected] = useState(null);
  const [selectedServer, setSelectedServer] = useState(null);
  const [syncCode, setSyncCode] = useState(() => localStorage.getItem(SYNC_CODE_KEY) || "");
  const [syncStatus, setSyncStatus] = useState(DB_AVAILABLE ? "local" : "unconfigured");
  const [showSettings, setShowSettings] = useState(false);
  const unsubRef = React.useRef(null);

  useEffect(() => {
    setShifts(loadJSON(SHIFTS_KEY, []));
    setRoster(loadJSON(ROSTER_KEY, []));
  }, []);

  useEffect(() => {
    if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; }
    if (!DB_AVAILABLE || !syncCode) { setSyncStatus(DB_AVAILABLE ? "local" : "unconfigured"); return; }
    setSyncStatus("connecting");
    const ref = db.collection("ledgers").doc(syncCode);
    ref.get().then((doc) => {
      if (doc.exists) {
        const data = doc.data() || {};
        const cloudShifts = data.shifts || [];
        const cloudRoster = data.roster || [];
        setShifts(cloudShifts); saveJSON(SHIFTS_KEY, cloudShifts);
        setRoster(cloudRoster); saveJSON(ROSTER_KEY, cloudRoster);
      } else {
        ref.set({ shifts: loadJSON(SHIFTS_KEY, []), roster: loadJSON(ROSTER_KEY, []) }, { merge: true }).catch(() => {});
      }
      unsubRef.current = ref.onSnapshot((snap) => {
        if (!snap.exists) return;
        const data = snap.data() || {};
        if (data.shifts) { setShifts(data.shifts); saveJSON(SHIFTS_KEY, data.shifts); }
        if (data.roster) { setRoster(data.roster); saveJSON(ROSTER_KEY, data.roster); }
      }, () => setSyncStatus("error"));
      setSyncStatus("synced");
    }).catch(() => setSyncStatus("error"));
    return () => { if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; } };
  }, [syncCode]);

  function handleConnectSync(code) {
    if (!code) return;
    localStorage.setItem(SYNC_CODE_KEY, code);
    setSyncCode(code);
    setShowSettings(false);
  }
  function handleDisconnectSync() {
    localStorage.removeItem(SYNC_CODE_KEY);
    setSyncCode("");
    setSyncStatus(DB_AVAILABLE ? "local" : "unconfigured");
  }

  function persistShifts(next) {
    setShifts(next);
    setSaveError(saveJSON(SHIFTS_KEY, next) ? "" : "Couldn't save — your browser storage may be full or blocked.");
    if (DB_AVAILABLE && syncCode) db.collection("ledgers").doc(syncCode).set({ shifts: next }, { merge: true }).catch(() => {});
  }
  function persistRoster(next) {
    setRoster(next);
    saveJSON(ROSTER_KEY, next);
    if (DB_AVAILABLE && syncCode) db.collection("ledgers").doc(syncCode).set({ roster: next }, { merge: true }).catch(() => {});
  }

  function addRosterServer(first, last) {
    const f = first.trim(), l = last.trim();
    if (!f) return;
    if (roster.some((r) => r.first.toLowerCase() === f.toLowerCase() && r.last.toLowerCase() === l.toLowerCase())) return;
    persistRoster([...roster, { id: uid(), first: f, last: l }]);
  }
  function deleteRosterServer(id) { persistRoster(roster.filter((r) => r.id !== id)); setSelectedServer(null); }

  function updateServer(roundId, serverId, field, value) {
    setDraft((d) => ({ ...d, rounds: d.rounds.map((r) => r.id !== roundId ? r : { ...r, servers: r.servers.map((s) => s.id === serverId ? { ...s, [field]: value } : s) }) }));
  }
  function addServer(roundId) {
    setDraft((d) => ({ ...d, rounds: d.rounds.map((r) => r.id !== roundId ? r : { ...r, servers: [...r.servers, { id: uid(), name: "", tip: "", carryForward: false, groupId: null }] }) }));
  }
  function removeServer(roundId, serverId) {
    setDraft((d) => ({ ...d, rounds: d.rounds.map((r) => r.id !== roundId ? r : { ...r, servers: r.servers.filter((s) => s.id !== serverId) }) }));
  }
  function addRound() {
    setDraft((d) => { if (d.rounds.length >= 4) return d; const nextIdx = Math.min(d.rounds[d.rounds.length - 1].startIdx + 1, TIME_PRESETS.length - 1); return { ...d, rounds: [...d.rounds, emptyRound(nextIdx)] }; });
  }
  function removeRound(roundId) { setDraft((d) => ({ ...d, rounds: d.rounds.filter((r) => r.id !== roundId) })); }
  function setRoundStartIdx(roundId, idx) { setDraft((d) => ({ ...d, rounds: d.rounds.map((r) => r.id === roundId ? { ...r, startIdx: idx } : r) })); }

  function updateBarServer(serverId, field, value) {
    setDraft((d) => ({ ...d, servers: d.servers.map((s) => s.id === serverId ? { ...s, [field]: value } : s) }));
  }
  function addBarServer() { setDraft((d) => ({ ...d, servers: [...d.servers, emptyBarServer()] })); }
  function removeBarServer(serverId) { setDraft((d) => ({ ...d, servers: d.servers.filter((s) => s.id !== serverId) })); }

  function toggleCarryForward(roundId, serverId) {
    setDraft((d) => {
      const ri = d.rounds.findIndex((r) => r.id === roundId);
      if (ri === -1 || ri >= d.rounds.length - 1) return d;
      const sv = d.rounds[ri].servers.find((s) => s.id === serverId);
      if (!sv) return d;
      const turningOn = !sv.carryForward;
      if (turningOn) {
        const groupId = sv.groupId || uid();
        return { ...d, rounds: d.rounds.map((r, idx) => {
          if (idx === ri) return { ...r, servers: r.servers.map((s) => s.id === serverId ? { ...s, carryForward: true, groupId, tip: "" } : s) };
          if (idx === ri + 1) {
            if (r.servers.some((s) => s.groupId === groupId)) return r;
            return { ...r, servers: [...r.servers, { id: uid(), name: sv.name, tip: "", carryForward: false, groupId }] };
          }
          return r;
        }) };
      }
      const groupId = sv.groupId;
      return { ...d, rounds: d.rounds.map((r, idx) => {
        if (idx === ri) return { ...r, servers: r.servers.map((s) => s.id === serverId ? { ...s, carryForward: false, groupId: null } : s) };
        if (idx === ri + 1 && groupId) return { ...r, servers: r.servers.map((s) => s.groupId === groupId ? { ...s, groupId: null } : s) };
        return r;
      }) };
    });
  }

  const draftTotals = useMemo(() => computeShift(draft), [draft]);

  function startEdit(shift) {
    if (shift.type === "bar") {
      setDraft({ date: shift.date, tipOutPercent: String(shift.tipOutPercent), type: "bar", servers: shift.servers.map((s) => ({ ...s })), adjustmentLabel: shift.adjustmentLabel || "", adjustmentAmount: shift.adjustmentAmount ? String(shift.adjustmentAmount) : "" });
    } else {
      setDraft({ date: shift.date, tipOutPercent: String(shift.tipOutPercent), type: "rotation", rounds: shift.rounds.map((r) => ({ id: r.id, startIdx: r.startIdx ?? 0, servers: r.servers.map((s) => ({ ...s })) })), adjustmentLabel: shift.adjustmentLabel || "", adjustmentAmount: shift.adjustmentAmount ? String(shift.adjustmentAmount) : "" });
    }
    setEditingId(shift.id); setTab("new");
  }
  function cancelEdit() { setEditingId(null); setDraft(emptyDraft("rotation")); }

  function saveShift() {
    let cleanDraft;
    if (draft.type === "bar") {
      cleanDraft = { ...draft, servers: draft.servers.filter((s) => s.name.trim() || parseFloat(s.cash) > 0 || parseFloat(s.credit) > 0) };
    } else {
      const cleanRounds = draft.rounds.map((r) => ({ ...r, servers: r.servers.filter((s) => s.name.trim() || parseFloat(s.tip) > 0) })).filter((r) => r.servers.length > 0);
      cleanDraft = { ...draft, rounds: cleanRounds };
    }
    if (editingId) persistShifts(shifts.map((s) => s.id === editingId ? { ...cleanDraft, id: editingId } : s));
    else persistShifts([{ ...cleanDraft, id: uid(), createdAt: new Date().toISOString() }, ...shifts]);
    setEditingId(null); setDraft(emptyDraft("rotation")); setTab("history");
  }
  function deleteShift(id) { persistShifts(shifts.filter((s) => s.id !== id)); if (editingId === id) cancelEdit(); }

  const sortedShifts = useMemo(() => [...shifts].sort((a, b) => (a.date < b.date ? 1 : -1)), [shifts]);
  const shiftsByDate = useMemo(() => { const map = {}; shifts.forEach((s) => { if (!map[s.date]) map[s.date] = []; map[s.date].push(s); }); return map; }, [shifts]);

  const analytics = useMemo(() => {
    if (shifts.length === 0) return null;
    const withTotals = shifts.map((s) => ({ ...s, ...computeShift(s) }));
    const chrono = [...withTotals].sort((a, b) => (a.date > b.date ? 1 : -1));
    const totalTakeHome = withTotals.reduce((s, x) => s + x.takeHome, 0);
    const totalTips = withTotals.reduce((s, x) => s + x.total, 0);
    const chartData = chrono.map((s) => ({ date: s.date.slice(5), takeHome: Math.round(s.takeHome * 100) / 100 }));
    const weekdayAgg = {};
    withTotals.forEach((s) => { const dow = new Date(s.date + "T00:00:00").getDay(); if (!weekdayAgg[dow]) weekdayAgg[dow] = { total: 0, count: 0 }; weekdayAgg[dow].total += s.takeHome; weekdayAgg[dow].count += 1; });
    const weekdayData = WEEKDAYS.map((label, idx) => ({ day: label, avg: weekdayAgg[idx] ? Math.round((weekdayAgg[idx].total / weekdayAgg[idx].count) * 100) / 100 : 0 }));
    const roundAgg = {};
    shifts.filter((s) => s.type !== "bar").forEach((s) => { const groups = computeGroupTotals(s); s.rounds.forEach((r) => { const label = TIME_PRESETS[r.startIdx ?? 0]; if (!roundAgg[label]) roundAgg[label] = { total: 0, count: 0 }; roundAgg[label].total += effectiveRoundTotal(r, groups); roundAgg[label].count += 1; }); });
    const roundData = TIME_PRESETS.filter((p) => roundAgg[p]).map((p) => ({ slot: p, avg: Math.round((roundAgg[p].total / roundAgg[p].count) * 100) / 100 }));
    const cashTotal = withTotals.reduce((s, x) => s + (x.cashTotal || 0), 0);
    const creditTotal = withTotals.reduce((s, x) => s + (x.creditTotal || 0), 0);
    return { totalTakeHome, avgTakeHome: totalTakeHome / withTotals.length, avgTips: totalTips / withTotals.length, chartData, weekdayData, roundData, cashTotal, creditTotal, count: shifts.length };
  }, [shifts]);

  const serverStats = useMemo(() => {
    const map = {};
    shifts.forEach((s) => {
      if (s.type === "bar") {
        s.servers.forEach((sv) => {
          const name = sv.name.trim(); if (!name) return;
          const tip = barServerTotal(sv);
          if (!map[name]) map[name] = { name, total: 0, appearances: 0, shiftDates: new Set() };
          map[name].total += tip; map[name].appearances += 1; map[name].shiftDates.add(s.date);
        });
        return;
      }
      const groups = computeGroupTotals(s);
      s.rounds.forEach((r) => r.servers.forEach((sv) => {
        const name = sv.name.trim(); if (!name) return;
        const tip = effectiveTip(sv, groups);
        if (!map[name]) map[name] = { name, total: 0, appearances: 0, shiftDates: new Set() };
        map[name].total += tip; map[name].appearances += 1; map[name].shiftDates.add(s.date);
      }));
    });
    return Object.values(map).map((x) => ({ name: x.name, total: Math.round(x.total * 100) / 100, appearances: x.appearances, shiftCount: x.shiftDates.size, avg: x.appearances ? Math.round((x.total / x.appearances) * 100) / 100 : 0 }));
  }, [shifts]);

  const tabs = [
    { id: "new", label: "New", icon: "＋" },
    { id: "history", label: "History", icon: "🕘" },
    { id: "servers", label: "Servers", icon: "👥" },
    { id: "analytics", label: "Trends", icon: "📈" },
  ];

  return (
    <div style={{ minHeight: "100vh", width: "100%" }}>
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "32px 16px 96px" }}>
        <header style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
          <div style={{ width: 40, height: 40, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, background: "var(--brass)", color: "var(--bg)", fontSize: 18 }}>🧾</div>
          <div style={{ flex: 1 }}>
            <h1 className="font-display" style={{ fontSize: 24, lineHeight: 1, margin: 0, color: "var(--brassLight)" }}>The Ledger</h1>
            <p style={{ fontSize: 12, margin: "4px 0 0", color: "var(--textMuted)" }}>Cocktail server tip tracking</p>
          </div>
          <button onClick={() => setShowSettings((s) => !s)}
            style={{ fontSize: 11, padding: "6px 10px", borderRadius: 20, border: "1px solid var(--line)", background: "var(--surface)", color: "var(--textMuted)", whiteSpace: "nowrap" }}>
            {syncStatus === "synced" ? "☁️ Synced" : syncStatus === "connecting" ? "⏳" : syncStatus === "error" ? "⚠️" : "📴 Local"}
          </button>
        </header>

        {showSettings && (
          <SyncSettings syncCode={syncCode} status={syncStatus} onConnect={handleConnectSync} onDisconnect={handleDisconnectSync} onClose={() => setShowSettings(false)} />
        )}

        <nav style={{ display: "flex", gap: 4, marginBottom: 24, padding: 4, borderRadius: 12, background: "var(--surface)" }}>
          {tabs.map(({ id, label, icon }) => (
            <button key={id} onClick={() => { setTab(id); if (id !== "servers") setSelectedServer(null); }}
              style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "8px 0", borderRadius: 8, fontSize: 11, fontWeight: 500, border: "none",
                background: tab === id ? "var(--brass)" : "transparent", color: tab === id ? "var(--bg)" : "var(--textMuted)" }}>
              <span style={{ fontSize: 14 }}>{icon}</span>{label}
            </button>
          ))}
        </nav>

        {tab === "new" ? (
          <NewShiftForm draft={draft} setDraft={setDraft} totals={draftTotals} roster={roster} updateServer={updateServer} addServer={addServer} removeServer={removeServer}
            addRound={addRound} removeRound={removeRound} setRoundStartIdx={setRoundStartIdx} toggleCarryForward={toggleCarryForward}
            updateBarServer={updateBarServer} addBarServer={addBarServer} removeBarServer={removeBarServer}
            onSave={saveShift} saveError={saveError}
            editingId={editingId} onCancelEdit={cancelEdit} />
        ) : tab === "history" ? (
          <HistoryTab shifts={sortedShifts} shiftsByDate={shiftsByDate} expanded={expanded} setExpanded={setExpanded} onDelete={deleteShift} onEdit={startEdit}
            view={historyView} setView={setHistoryView} calMonth={calMonth} setCalMonth={setCalMonth} calSelected={calSelected} setCalSelected={setCalSelected} />
        ) : tab === "servers" ? (
          <ServersTab roster={roster} serverStats={serverStats} shifts={shifts} onAdd={addRosterServer} onDelete={deleteRosterServer} selected={selectedServer} setSelected={setSelectedServer} />
        ) : (
          <Analytics analytics={analytics} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TipLedger />);
</script>
</body>
</html>
